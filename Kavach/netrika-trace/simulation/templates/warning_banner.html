<!-- Netrika-Trace Warning Banner — Injected into response for WARN decisions -->
<div id="netrika-trace-warning" style="
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 999999;
    background: linear-gradient(135deg, #1a1200 0%, #2d1f00 100%);
    border-bottom: 2px solid #ffb020;
    padding: 14px 24px;
    font-family: 'Courier New', Courier, monospace;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 4px 20px rgba(255, 176, 32, 0.15);
">
    <div style="display:flex;align-items:center;gap:12px;">
        <span style="
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ffb020;
            animation: ntWarnPulse 1.5s infinite;
        "></span>
        <span style="
            color: #ffb020;
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
        ">⚠ NETRIKA·TRACE WARNING</span>
        <span style="
            color: #c8d8e8;
            font-size: 12px;
        ">
            Potential data leak detected — Risk Score: 
            <strong style="color: #ffb020;">{{ risk_score }}</strong>/100
        </span>
    </div>
    <div style="display:flex;align-items:center;gap:16px;">
        <span style="
            color: #4a6278;
            font-size: 10px;
            letter-spacing: 1px;
        ">
            {% for etype in entity_types %}
            <span style="
                background: rgba(255, 176, 32, 0.15);
                color: #ffb020;
                padding: 2px 8px;
                border-radius: 3px;
                margin: 0 2px;
                font-size: 10px;
            ">{{ etype }}</span>
            {% endfor %}
        </span>
        <button onclick="this.parentElement.parentElement.remove()" style="
            background: none;
            border: 1px solid #4a6278;
            color: #4a6278;
            padding: 4px 12px;
            cursor: pointer;
            font-family: monospace;
            font-size: 10px;
            letter-spacing: 1px;
        ">DISMISS</button>
    </div>
</div>
<style>
    @keyframes ntWarnPulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.3; }
    }
    body { padding-top: 52px !important; }
</style>
