<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="-8 -8 272 272" role="img" aria-label="Kavach" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Kavach</title><style>
.sweep{animation:sweep 3.2s cubic-bezier(.65,0,.35,1) infinite}
.orbit{transform-origin:128px 128px;animation:spin 14s linear infinite}
.glow{animation:glow 3.2s ease-in-out infinite}
.node{transform-origin:162px 80px;animation:node 3.2s ease-in-out infinite}
.b1{animation:d1 9s ease-in-out infinite alternate}
.b2{animation:d2 11s ease-in-out infinite alternate}
.b3{animation:d3 13s ease-in-out infinite alternate}
@keyframes sweep{0%{transform:translateY(-130px)}60%,100%{transform:translateY(135px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes glow{0%,100%{opacity:.35}50%{opacity:.8}}
@keyframes node{0%,100%{transform:scale(1)}45%{transform:scale(1.5)}}
@keyframes d1{to{transform:translate(50px,40px)}}
@keyframes d2{to{transform:translate(-60px,30px)}}
@keyframes d3{to{transform:translate(20px,-50px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>
 <linearGradient id="maur" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#4F46E5"/><stop offset=".45" stop-color="#60A5FA"/>
  <stop offset=".75" stop-color="#F0ABFC"/><stop offset="1" stop-color="#FDBA8C"/>
 </linearGradient>
 <linearGradient id="mink" gradientUnits="userSpaceOnUse" x1="98" y1="78" x2="166" y2="184">
  <stop offset="0" stop-color="#4338CA"/><stop offset="1" stop-color="#6366F1"/>
 </linearGradient>
 <linearGradient id="mbeam" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#6EE7B7" stop-opacity="0"/>
  <stop offset=".85" stop-color="#6EE7B7" stop-opacity=".55"/>
  <stop offset="1" stop-color="#34D399" stop-opacity="1"/>
 </linearGradient>
 <filter id="mblur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
 <filter id="msoft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="9"/></filter>
 <clipPath id="mouter"><path d="M128 16 C160 36 196 44 224 44 V120 C224 176 184 216 128 240 C72 216 32 176 32 120 V44 C60 44 96 36 128 16 Z"/></clipPath>
 <clipPath id="minner"><path d="M128 16 C160 36 196 44 224 44 V120 C224 176 184 216 128 240 C72 216 32 176 32 120 V44 C60 44 96 36 128 16 Z" transform="translate(128 130) scale(.8) translate(-128 -130)"/></clipPath>
</defs>
<g class="orbit" opacity=".9">
 <circle cx="128" cy="128" r="124" fill="none" stroke="#C7D2FE" stroke-width="1.5" stroke-dasharray="2 9" stroke-linecap="round"/>
 <circle cx="128" cy="4" r="5" fill="#6EE7B7"/><circle cx="252" cy="128" r="4" fill="#F0ABFC"/><circle cx="40" cy="216" r="4.5" fill="#FDBA8C"/>
</g>
<path class="glow" d="M128 16 C160 36 196 44 224 44 V120 C224 176 184 216 128 240 C72 216 32 176 32 120 V44 C60 44 96 36 128 16 Z" fill="url(#maur)" filter="url(#msoft)" opacity=".5"/>
<path d="M128 16 C160 36 196 44 224 44 V120 C224 176 184 216 128 240 C72 216 32 176 32 120 V44 C60 44 96 36 128 16 Z" fill="url(#maur)"/>
<g clip-path="url(#mouter)" filter="url(#mblur)" opacity=".9">
 <circle class="b1" cx="70" cy="70" r="52" fill="#4F46E5"/>
 <circle class="b2" cx="190" cy="100" r="48" fill="#F0ABFC"/>
 <circle class="b3" cx="120" cy="200" r="50" fill="#6EE7B7"/>
</g>
<path d="M128 16 C160 36 196 44 224 44 V120 C224 176 184 216 128 240 C72 216 32 176 32 120 V44 C60 44 96 36 128 16 Z" transform="translate(128 130) scale(.8) translate(-128 -130)" fill="#FFFFFF" fill-opacity=".96"/>
<g stroke="url(#mink)" stroke-width="17" stroke-linecap="round" stroke-linejoin="round" fill="none">
 <path d="M100 80 V180"/><path d="M100 132 L158 84"/><path d="M104 130 L162 180"/>
</g>
<circle class="node" cx="162" cy="80" r="9" fill="#34D399"/><circle cx="162" cy="80" r="3.5" fill="#fff"/>
<g clip-path="url(#minner)"><g class="sweep">
 <rect x="30" y="38" width="196" height="44" fill="url(#mbeam)"/>
 <rect x="30" y="80" width="196" height="3" rx="1.5" fill="#10B981"/>
</g></g>
</svg>